<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><title>Agent 工作链路 UI 线框图</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#1f2937} .t{font-size:25px;font-weight:700} .s{font-size:17px} .xs{font-size:14px} .node{fill:#f7fafc;stroke:#718096;stroke-width:1.6} .blue{fill:#e9f2ff;stroke:#5a85bf;stroke-width:1.6} .green{fill:#e8f5e9;stroke:#66a171;stroke-width:1.6} .amber{fill:#fff6df;stroke:#c59a43;stroke-width:1.6} .red{fill:#fff0f0;stroke:#c77777;stroke-width:1.6} .muted{fill:#526176}</style><rect width="1500" height="1000" fill="#f8fafc"/><rect width="1500" height="75" fill="#fff" stroke="#d3dce7"/><text x="35" y="45" class="t">运行详情 / Agent 工作链路</text><text x="630" y="43" class="s muted">Experiment / Run / CaseExecution ID · 当前状态来自最近观测事件</text><rect x="30" y="105" width="985" height="600" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="145" class="s" font-weight="700">实际调用图（动态节点；示意）</text><rect x="365" y="180" width="300" height="85" rx="12" class="blue"/><text x="515" y="215" text-anchor="middle" class="s" font-weight="700">Orchestrator</text><text x="515" y="242" text-anchor="middle" class="xs">running · observed</text><rect x="90" y="345" width="260" height="85" rx="12" class="green"/><text x="220" y="380" text-anchor="middle" class="s" font-weight="700">Manager</text><text x="220" y="407" text-anchor="middle" class="xs">completed</text><rect x="390" y="345" width="260" height="85" rx="12" class="amber"/><text x="520" y="380" text-anchor="middle" class="s" font-weight="700">Engineer child</text><text x="520" y="407" text-anchor="middle" class="xs">waiting_for_tool</text><rect x="690" y="345" width="260" height="85" rx="12" class="red"/><text x="820" y="380" text-anchor="middle" class="s" font-weight="700">Provider/Tool request</text><text x="820" y="407" text-anchor="middle" class="xs">unknown / stale</text><path d="M515 265 V300 H220 V345 M515 300 V345 M515 300 H820 V345" stroke="#64748b" stroke-width="2" fill="none"/><path d="M213 332 l7 13 7 -13 M513 332 l7 13 7 -13 M813 332 l7 13 7 -13" stroke="#64748b" stroke-width="2" fill="none"/><text x="60" y="485" class="xs muted">节点显示：父子关系 / 状态 / 起止时间 / 模型路由 / Token / 费用 / 关联日志 / Artifact</text><rect x="60" y="520" width="925" height="150" rx="9" class="node"/><text x="85" y="555" class="s" font-weight="700">事件时间线（示意）</text><text x="85" y="590" class="xs">11:04:01.120  invocation_started  inv-01</text><text x="85" y="618" class="xs">11:04:02.006  child_invocation_created  parent=inv-01</text><text x="85" y="646" class="xs">11:04:05.840  provider_response_unknown  request=req-17</text><rect x="1040" y="105" width="430" height="600" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="1070" y="145" class="s" font-weight="700">选中节点的详情</text><text x="1070" y="190" class="xs">Invocation ID: inv-17</text><text x="1070" y="220" class="xs">Parent ID: inv-01</text><text x="1070" y="250" class="xs">Planned route: Model profile A</text><text x="1070" y="280" class="xs">Observed route: unknown</text><text x="1070" y="310" class="xs">Token usage: unknown (not 0)</text><rect x="1070" y="345" width="370" height="95" rx="8" class="amber"/><text x="1255" y="380" text-anchor="middle" class="xs">状态 unknown/stale</text><text x="1255" y="406" text-anchor="middle" class="xs">需查询/对账，不可盲目重放</text><text x="1070" y="480" class="xs">[日志] [请求/关联 ID] [产物] [清理]</text><text x="1070" y="520" class="xs">敏感信息入库前脱敏</text><rect x="30" y="735" width="1440" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="60" y="775" class="s" font-weight="700">工作流状态汇总</text><text x="60" y="815" class="xs">Queued · Running · Waiting · Completed · Failed · Cancelled · Blocked · Interrupted · Unknown/Stale</text><text x="60" y="850" class="xs">可过滤：Agent/角色、状态、时间、调用模型、工具、错误类别、Token 消耗、Artifact</text><text x="60" y="890" class="xs muted">线框图展示信息需求，不代表真实运行数据；模拟路由图与实际观测链路分开呈现。</text></svg>