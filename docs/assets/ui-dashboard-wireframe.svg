<line x1="1042" y1="551" x2="1366" y2="551" class="line"/><circle cx="1054" cy="578" r="8" fill="#21875b"/><path d="M1050 578 l3 3 l5 -6" stroke="#fff" fill="none" stroke-width="1.8"/><text x="1074" y="583" class="text body">模型连接可用</text><text x="1350" y="583" class="text green small">通过</text>
<line x1="1042" y1="604" x2="1366" y2="604" class="line"/><circle cx="1054" cy="631" r="8" fill="#21875b"/><path d="M1050 631 l3 3 l5 -6" stroke="#fff" fill="none" stroke-width="1.8"/><text x="1074" y="636" class="text body">配置约束检查</text><text x="1350" y="636" class="text green small">通过</text>
<line x1="1042" y1="657" x2="1366" y2="657" class="line"/><circle cx="1054" cy="684" r="8" fill="#f0ad32"/><text x="1051" y="688" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#fff">!</text><text x="1074" y="689" class="text body">真实执行权限</text><text x="1326" y="689" class="text amber small">待确认</text>
<rect x="1042" y="726" width="324" height="76" rx="8" fill="#fff7e8" stroke="#f4d6a0"/><text x="1058" y="750" class="text amber" font-size="13" font-weight="700">需要你确认 1 项设置</text><text x="1058" y="772" class="text muted small">真实模型调用可能产生费用。请核对模型、</text><text x="1058" y="790" class="text muted small">预算与权限后再开始。</text>
<rect x="1042" y="823" width="324" height="42" rx="8" fill="#1d5fbf"/><text x="1132" y="849" font-family="'Noto Sans CJK SC',sans-serif" font-size="14" font-weight="700" fill="#fff">检查并创建测试</text>
<text x="270" y="926" class="text muted small">界面概念稿 V1.9 · 不是已实现功能截图；具体数据均为示意，不代表实测成绩。</text>
