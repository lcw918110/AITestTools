<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
<defs><style>
.text{font-family:'Noto Sans CJK SC',sans-serif;fill:#1f2937}.muted{fill:#657184}.small{font-size:13px}.body{font-size:15px}.h2{font-size:22px;font-weight:700}.title{font-size:25px;font-weight:700}.label{font-size:12px;font-weight:700;letter-spacing:.4px}.card{fill:#fff;stroke:#dfe5ec;stroke-width:1}.nav{font-family:'Noto Sans CJK SC',sans-serif;font-size:15px;fill:#475569}.navsel{font-family:'Noto Sans CJK SC',sans-serif;font-size:15px;font-weight:700;fill:#184e9e}.blue{fill:#1d5fbf}.green{fill:#21875b}.amber{fill:#9b6500}.red{fill:#b42318}.line{stroke:#e4e9ef;stroke-width:1}
</style></defs>
<rect width="1440" height="960" fill="#f4f6f9"/>
<rect x="0" y="0" width="1440" height="72" fill="#ffffff"/><line x1="0" y1="71" x2="1440" y2="71" class="line"/>
<rect x="28" y="18" width="38" height="38" rx="10" fill="#245fbd"/><path d="M38 38 L45 45 L57 29" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="34" class="text" font-size="17" font-weight="700">AITestTools</text><text x="80" y="52" class="text muted small">Agent 评测工作台</text>
<text x="1136" y="31" class="text small">本地运行 · 当前项目</text><circle cx="1119" cy="27" r="5" fill="#21875b"/><text x="1136" y="51" class="text muted small">运行环境已检查</text>
<rect x="0" y="72" width="236" height="888" fill="#fff"/><line x1="235" y1="72" x2="235" y2="960" class="line"/>
<text x="28" y="112" class="text muted label">工作区</text>
<rect x="14" y="129" width="208" height="46" rx="8" fill="#eaf2ff"/><text x="48" y="157" class="navsel">总览</text>
<text x="48" y="211" class="nav">新建测试</text><text x="48" y="265" class="nav">测试集与要求</text><text x="48" y="319" class="nav">运行记录</text><text x="48" y="373" class="nav">结果对比</text>
<line x1="24" y1="408" x2="212" y2="408" class="line"/><text x="28" y="439" class="text muted label">管理</text><text x="48" y="479" class="nav">环境与连接</text><text x="48" y="533" class="nav">使用说明</text>
<rect x="18" y="844" width="200" height="86" rx="10" fill="#f7f9fc" stroke="#e2e8f0"/><text x="32" y="870" class="text" font-size="13" font-weight="700">新手提示</text><text x="32" y="891" class="text muted small">先选择测试集，再按向导</text><text x="32" y="909" class="text muted small">检查配置并开始运行。</text>
<text x="270" y="119" class="text title">运行总览</text><text x="270" y="149" class="text muted body">一眼查看最近测试、运行进度和需要处理的问题。</text>
<rect x="1168" y="94" width="222" height="44" rx="8" fill="#1d5fbf"/><text x="1207" y="121" font-family="'Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#fff">＋  创建一次测试</text>
<!-- status banner -->
<rect x="270" y="174" width="1120" height="91" rx="12" fill="#fff6e8" stroke="#f0d4a3"/><circle cx="300" cy="207" r="10" fill="#bd7a13"/><path d="M300 201 v7 M300 212 v1" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/><text x="323" y="204" class="text" font-size="17" font-weight="700">最近一次运行已结束，部分项需关注</text><text x="323" y="229" class="text muted body">万象术功能回归 · 28 / 32 项通过 · 2 项失败 · 1 项待复核 · 1 项无法判定</text><rect x="1196" y="196" width="166" height="40" rx="7" fill="#fff" stroke="#b7d9c4"/><text x="1230" y="221" class="text green body" font-weight="700">查看运行详情  ›</text>
<!-- KPI cards -->
<g><rect x="270" y="284" width="268" height="118" rx="10" class="card"/><text x="290" y="313" class="text muted body">本周运行次数</text><text x="290" y="357" class="text" font-size="30" font-weight="700">18</text><text x="290" y="382" class="text muted small">包含重复运行</text></g>
<g><rect x="552" y="284" width="268" height="118" rx="10" class="card"/><text x="572" y="313" class="text muted body">范围内通过率</text><text x="572" y="357" class="text green" font-size="30" font-weight="700">87.5%</text><text x="572" y="382" class="text muted small">28 / 32 个计划适用项</text></g>
<g><rect x="834" y="284" width="268" height="118" rx="10" class="card"/><text x="854" y="313" class="text muted body">需要关注</text><text x="854" y="357" class="text red" font-size="30" font-weight="700">4</text><text x="854" y="382" class="text muted small">失败 2 · 待复核 1 · 未知 1</text></g>
<g><rect x="1116" y="284" width="274" height="118" rx="10" class="card"/><text x="1136" y="313" class="text muted body">运行环境</text><text x="1136" y="352" class="text amber" font-size="22" font-weight="700">需确认</text><text x="1136" y="382" class="text muted small">模型连接通过 · 执行权限待确认</text></g>
<!-- Recent run list -->
<rect x="270" y="422" width="730" height="470" rx="12" class="card"/><text x="294" y="459" class="text h2">最近的测试</text><text x="294" y="484" class="text muted small">点击任意一行，查看每个任务的结果和证据。</text>
<rect x="290" y="505" width="690" height="39" rx="5" fill="#f7f9fc"/><text x="306" y="529" class="text muted label">测试名称</text><text x="566" y="529" class="text muted label">进度 / 结果</text><text x="714" y="529" class="text muted label">耗时</text><text x="824" y="529" class="text muted label">状态</text>
<line x1="290" y1="598" x2="980" y2="598" class="line"/><text x="306" y="572" class="text body" font-weight="700">万象术功能回归</text><text x="306" y="591" class="text muted small">数据集 V1 · 模型 A · 插件开启</text><text x="566" y="576" class="text body">30 / 32 已评估</text><text x="714" y="576" class="text body">08:42</text><rect x="814" y="557" width="92" height="27" rx="13" fill="#fff2e0"/><text x="835" y="575" class="text amber small" font-weight="700">有失败</text><text x="934" y="575" class="text blue body">›</text>
<line x1="290" y1="655" x2="980" y2="655" class="line"/><text x="306" y="629" class="text body" font-weight="700">配置对照试验</text><text x="306" y="648" class="text muted small">同一任务集 · 配置 OFF / ON</text><text x="566" y="633" class="text body">20 / 20</text><text x="714" y="633" class="text body">05:16</text><rect x="814" y="614" width="92" height="27" rx="13" fill="#e8f7ee"/><text x="836" y="632" class="text green small" font-weight="700">已完成</text><text x="934" y="632" class="text blue body">›</text>
<line x1="290" y1="712" x2="980" y2="712" class="line"/><text x="306" y="686" class="text body" font-weight="700">终端任务冒烟测试</text><text x="306" y="705" class="text muted small">4 个任务 · 本地假宿主</text><text x="566" y="690" class="text body">4 / 4</text><text x="714" y="690" class="text body">00:36</text><rect x="814" y="671" width="92" height="27" rx="13" fill="#e8f7ee"/><text x="836" y="689" class="text green small" font-weight="700">已完成</text><text x="934" y="689" class="text blue body">›</text>
<line x1="290" y1="769" x2="980" y2="769" class="line"/><text x="306" y="743" class="text body" font-weight="700">真实环境连接检查</text><text x="306" y="762" class="text muted small">模型连接 / 工具权限 / 工作目录</text><text x="566" y="747" class="text body">—</text><text x="714" y="747" class="text body">00:03</text><rect x="814" y="728" width="92" height="27" rx="13" fill="#feeceb"/><text x="836" y="746" class="text red small" font-weight="700">被阻止</text><text x="934" y="746" class="text blue body">›</text>
<rect x="294" y="812" width="680" height="48" rx="7" fill="#f7f9fc"/><text x="313" y="832" class="text muted small">注意：未运行、被阻止、失败和通过是不同状态；</text><text x="313" y="850" class="text muted small">缺少 Token/成本来源时会显示“暂无可靠数据”，不会显示为 0。</text>
<!-- preflight panel -->
<rect x="1018" y="422" width="372" height="470" rx="12" class="card"/><text x="1042" y="459" class="text h2">运行前检查</text><text x="1042" y="484" class="text muted small">开始真实测试之前，先确认以下项目。</text>
