<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"><title>万象术功能配置界面线框图</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#1f2937} .t{font-size:25px;font-weight:700} .s{font-size:17px} .xs{font-size:14px} .node{fill:#f7fafc;stroke:#718096;stroke-width:1.6} .blue{fill:#e9f2ff;stroke:#5a85bf;stroke-width:1.6} .green{fill:#e8f5e9;stroke:#66a171;stroke-width:1.6} .amber{fill:#fff6df;stroke:#c59a43;stroke-width:1.6} .red{fill:#fff0f0;stroke:#c77777;stroke-width:1.6} .muted{fill:#526176}</style><rect width="1500" height="1000" fill="#f8fafc"/><rect width="1500" height="75" fill="#fff" stroke="#d3dce7"/><text x="35" y="45" class="t">万象术功能目录</text><text x="465" y="43" class="s muted">目标插件版本：pinned commit · 目录来源：ablation resources · 配置 hash: —</text><rect x="35" y="105" width="340" height="110" rx="12" class="blue"/><text x="65" y="140" class="s" font-weight="700">源目录示例：56 个 package</text><text x="65" y="171" class="xs">节点数不等于开关数</text><text x="65" y="195" class="xs">外部控制点、Profile、默认行为分别统计</text><rect x="395" y="105" width="340" height="110" rx="12" class="green"/><text x="425" y="140" class="s" font-weight="700">配置校验</text><text x="425" y="171" class="xs">station-order / borrow / 依赖 / 互斥</text><text x="425" y="195" class="xs">非法组合阻止模拟与正式运行</text><rect x="755" y="105" width="340" height="110" rx="12" class="amber"/><text x="785" y="140" class="s" font-weight="700">模拟路由</text><text x="785" y="171" class="xs">只读生成预计节点路径</text><text x="785" y="195" class="xs">不发起模型请求/Agent 调用</text><rect x="1115" y="105" width="350" height="110" rx="12" class="node"/><text x="1145" y="140" class="s" font-weight="700">实际运行对照</text><text x="1145" y="171" class="xs">AgentInvocation/Event 事实</text><text x="1145" y="195" class="xs">模拟图 != 实际图</text>
<rect x="35" y="245" width="560" height="700" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="65" y="285" class="s" font-weight="700">目录节点（示意，不代表可编辑开关）</text><rect x="65" y="310" width="500" height="44" rx="7" fill="#eef2f7"/><text x="80" y="338" class="xs">节点 ID / 默认行为</text><text x="300" y="338" class="xs">控制方式</text><text x="430" y="338" class="xs">校验</text>
<rect x="65" y="365" width="500" height="48" rx="7" class="node"/><text x="80" y="394" class="xs">NODE-A / 固定默认行为</text><text x="300" y="394" class="xs">无外部开关</text><text x="430" y="394" class="xs">通过</text><rect x="65" y="423" width="500" height="48" rx="7" class="node"/><text x="80" y="452" class="xs">NODE-B / 选择命名 Profile</text><text x="300" y="452" class="xs">Profile 级</text><text x="430" y="452" class="xs">通过</text><rect x="65" y="481" width="500" height="48" rx="7" class="node"/><text x="80" y="510" class="xs">NODE-C / 单项控制待证实</text><text x="300" y="510" class="xs">未设置</text><text x="430" y="510" class="xs">未验证</text><rect x="65" y="539" width="500" height="48" rx="7" class="red"/><text x="80" y="568" class="xs">NODE-D / 源 Profile 状态</text><text x="300" y="568" class="xs">Profile 内状态</text><text x="430" y="568" class="xs">冲突检查</text><text x="65" y="655" class="xs muted">搜索 / 按类型筛选 / 只看依赖 / 只看待验证</text><text x="65" y="695" class="xs muted">Profile 中有状态，不代表运行时可单独覆盖</text><text x="65" y="730" class="xs muted">只有实际支持的控制点显示为可编辑，不造虚假开关</text><rect x="625" y="245" width="840" height="420" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="655" y="285" class="s" font-weight="700">依赖图 / 模拟路径</text><rect x="690" y="350" width="180" height="70" rx="10" class="blue"/><text x="780" y="380" text-anchor="middle" class="xs">基础依赖</text><text x="780" y="401" text-anchor="middle" class="xs">active</text><rect x="950" y="350" width="180" height="70" rx="10" class="green"/><text x="1040" y="380" text-anchor="middle" class="xs">依赖节点</text><text x="1040" y="401" text-anchor="middle" class="xs">borrowed</text><rect x="1210" y="350" width="180" height="70" rx="10" class="amber"/><text x="1300" y="380" text-anchor="middle" class="xs">后继节点</text><text x="1300" y="401" text-anchor="middle" class="xs">active</text><path d="M870 385 H950" stroke="#64748b" stroke-width="2" fill="none"/><path d="M1130 385 H1210" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" fill="none"/><path d="M937 378 l13 7 -13 7 M1197 378 l13 7 -13 7" stroke="#64748b" stroke-width="2" fill="none"/><text x="655" y="475" class="xs">校验结果：无环 / 依赖满足 / 无互斥冲突（示意）</text><text x="655" y="508" class="xs">模拟结果 Hash：运行前生成</text><text x="655" y="541" class="xs">实线：station-order（顺序 / active 前置）；虚线：borrow（borrowed/active 前置）</text><text x="655" y="562" class="xs">“模拟路由”只计算路径，不运行 Host/Agent/Provider</text><rect x="655" y="575" width="770" height="55" rx="9" class="green"/><text x="1040" y="608" text-anchor="middle" class="s">[ 校验真实控制配置 ]   [ 标记假设路由 ]   [ 生成实验矩阵 ]</text><rect x="625" y="690" width="840" height="255" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="655" y="730" class="s" font-weight="700">变更影响与交互关系</text><text x="655" y="770" class="xs">被依赖节点先加入累积顺序；相互影响节点生成配对/小组实验</text><text x="655" y="805" class="xs">不可独立控制的节点只能做 Profile 对照或默认行为观察</text><text x="655" y="840" class="xs">未知控制能力显示待核验，不可显示为“配置已完成”</text><text x="655" y="900" class="xs muted">线框图数据为占位演示，只表达交互要求，不代表万象术真实节点定义。</text></svg>