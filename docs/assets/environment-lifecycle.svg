<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="600" viewBox="0 0 1500 600"><title>测试环境生命周期</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#1f2937} .t{font-size:25px;font-weight:700} .s{font-size:17px} .xs{font-size:14px} .node{fill:#f7fafc;stroke:#718096;stroke-width:1.6} .blue{fill:#e9f2ff;stroke:#5a85bf;stroke-width:1.6} .green{fill:#e8f5e9;stroke:#66a171;stroke-width:1.6} .amber{fill:#fff6df;stroke:#c59a43;stroke-width:1.6} .red{fill:#fff0f0;stroke:#c77777;stroke-width:1.6} .muted{fill:#526176}</style><rect width="1500" height="600" fill="#fff"/><text x="55" y="55" class="t">可复现测试环境生命周期</text><text x="55" y="83" class="s muted">Profile 是配方；Instance 是一次环境；Manifest 记录实际事实与可复现边界</text>
<rect x="60" y="150" width="235" height="105" rx="14" class="blue"/><text x="177" y="188" text-anchor="middle" class="s" font-weight="700">EnvironmentProfile</text><text x="177" y="217" text-anchor="middle" class="xs">版本配方 / 锁文件</text><text x="177" y="237" text-anchor="middle" class="xs">数据种子 / 网络 / 隔离</text>
<rect x="355" y="150" width="235" height="105" rx="14" class="node"/><text x="472" y="188" text-anchor="middle" class="s" font-weight="700">一键创建</text><text x="472" y="217" text-anchor="middle" class="xs">resolve / provision</text><text x="472" y="237" text-anchor="middle" class="xs">预检与能力检查</text>
<rect x="650" y="150" width="235" height="105" rx="14" class="green"/><text x="767" y="188" text-anchor="middle" class="s" font-weight="700">Ready / Running</text><text x="767" y="217" text-anchor="middle" class="xs">关联 Experiment / Run</text><text x="767" y="237" text-anchor="middle" class="xs">受控工作区与执行</text>
<rect x="945" y="150" width="235" height="105" rx="14" class="amber"/><text x="1062" y="188" text-anchor="middle" class="s" font-weight="700">Stop / Reset / Clean</text><text x="1062" y="217" text-anchor="middle" class="xs">外部状态与进程对账</text><text x="1062" y="237" text-anchor="middle" class="xs">清理结果须可观察</text>
<rect x="1240" y="150" width="200" height="105" rx="14" class="blue"/><text x="1340" y="188" text-anchor="middle" class="s" font-weight="700">Destroy</text><text x="1340" y="217" text-anchor="middle" class="xs">记录删除/资源释放</text><text x="1340" y="237" text-anchor="middle" class="xs">可从 Profile 重建</text>
<path d="M295 202 H355 M590 202 H650 M885 202 H945 M1180 202 H1240" stroke="#64748b" stroke-width="2" fill="none"/><path d="M342 195 l13 7 -13 7 M637 195 l13 7 -13 7 M932 195 l13 7 -13 7 M1227 195 l13 7 -13 7" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="250" y="355" width="1000" height="125" rx="14" class="node"/><text x="750" y="390" text-anchor="middle" class="s" font-weight="700">EnvironmentManifest（每个实例/Run 关联）</text><text x="750" y="424" text-anchor="middle" class="xs">Git commit/dirty state · OS/Host/Plugin/Node · lockfile/config hashes · Dataset/seed</text><text x="750" y="449" text-anchor="middle" class="xs">网络/隔离 Profile · 创建/重置/销毁事件 · 资源与清理结果 · 外部依赖限制</text>
<path d="M472 255 V310 H750 V355 M767 255 V355 M1062 255 V310 H750" stroke="#64748b" stroke-width="2" fill="none"/><path d="M743 342 l7 13 7 -13" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="55" y="545" class="xs muted">环境可重建不等于 OS 隔离已验证；Profile 相同但远端模型/数据变化时须披露复现限制。</text></svg>