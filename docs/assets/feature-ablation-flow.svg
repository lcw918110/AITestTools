<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950"><title>万象术功能配置依赖与路由流程</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#1f2937} .t{font-size:25px;font-weight:700} .s{font-size:17px} .xs{font-size:14px} .node{fill:#f7fafc;stroke:#718096;stroke-width:1.6} .blue{fill:#e9f2ff;stroke:#5a85bf;stroke-width:1.6} .green{fill:#e8f5e9;stroke:#66a171;stroke-width:1.6} .amber{fill:#fff6df;stroke:#c59a43;stroke-width:1.6} .red{fill:#fff0f0;stroke:#c77777;stroke-width:1.6} .muted{fill:#526176}</style><rect width="1600" height="950" fill="#ffffff"/><text x="60" y="60" class="t">万象术功能配置、依赖校验与路由核对</text><text x="60" y="91" class="s muted">配置模拟是只读计划；真实调用图必须由运行事实构建</text>
<rect x="60" y="135" width="320" height="145" rx="14" class="blue"/><text x="220" y="172" text-anchor="middle" class="s" font-weight="700">固定版本资源导入</text><text x="220" y="204" text-anchor="middle" class="xs">nodes.json / profiles.json</text><text x="220" y="228" text-anchor="middle" class="xs">fact-map.json / tool-map.json</text><text x="220" y="253" text-anchor="middle" class="xs">Commit + 文件 Hash</text>
<rect x="450" y="135" width="320" height="145" rx="14" class="node"/><text x="610" y="172" text-anchor="middle" class="s" font-weight="700">目录核对</text><text x="610" y="204" text-anchor="middle" class="xs">源节点数 / 可控项 / 派生项</text><text x="610" y="228" text-anchor="middle" class="xs">映射缺口 / 状态 Schema</text><text x="610" y="253" text-anchor="middle" class="xs">不假造缺失开关</text>
<rect x="840" y="135" width="320" height="145" rx="14" class="amber"/><text x="1000" y="172" text-anchor="middle" class="s" font-weight="700">依赖与互斥校验</text><text x="1000" y="204" text-anchor="middle" class="xs">station-order：顺序 + active 前置</text><text x="1000" y="228" text-anchor="middle" class="xs">borrow：校验状态前置条件</text><text x="1000" y="253" text-anchor="middle" class="xs">依赖 / 冲突 / 环 / 非法状态则阻断</text>
<rect x="1230" y="135" width="310" height="145" rx="14" class="green"/><text x="1385" y="172" text-anchor="middle" class="s" font-weight="700">RouteSimulation</text><text x="1385" y="204" text-anchor="middle" class="xs">预计功能状态与调用链</text><text x="1385" y="228" text-anchor="middle" class="xs">配置 Hash + 算法版本</text><text x="1385" y="253" text-anchor="middle" class="xs">无 Provider/Agent 副作用</text>
<path d="M380 207 H450 M770 207 H840 M1160 207 H1230" stroke="#64748b" stroke-width="2" fill="none"/><path d="M437 200 l13 7 -13 7 M827 200 l13 7 -13 7 M1217 200 l13 7 -13 7" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="110" y="365" width="410" height="170" rx="14" class="node"/><text x="315" y="402" text-anchor="middle" class="s" font-weight="700">实验矩阵生成</text><text x="315" y="436" text-anchor="middle" class="xs">整体插件 OFF/ON</text><text x="315" y="461" text-anchor="middle" class="xs">受支持的命名 Profile 对照</text><text x="315" y="486" text-anchor="middle" class="xs">已验证单项控制 / 有效组合</text><text x="315" y="511" text-anchor="middle" class="xs">模型层级 × 任务类型/难度</text>
<rect x="595" y="365" width="410" height="170" rx="14" class="blue"/><text x="800" y="402" text-anchor="middle" class="s" font-weight="700">冻结实验计划</text><text x="800" y="436" text-anchor="middle" class="xs">所选命名 Profile 快照 / Dataset Release</text><text x="800" y="461" text-anchor="middle" class="xs">模型、环境、预算、判定器</text><text x="800" y="486" text-anchor="middle" class="xs">顺序、重复、故障条件</text><text x="800" y="511" text-anchor="middle" class="xs">计划版本 + Config Hash</text>
<rect x="1080" y="365" width="410" height="170" rx="14" class="green"/><text x="1285" y="402" text-anchor="middle" class="s" font-weight="700">真实执行与事实采集</text><text x="1285" y="436" text-anchor="middle" class="xs">Host / AgentInvocation / Tool / Provider</text><text x="1285" y="461" text-anchor="middle" class="xs">实际状态 / 事件 / 日志 / usage</text><text x="1285" y="486" text-anchor="middle" class="xs">环境 Manifest / Artifact Hash</text><text x="1285" y="511" text-anchor="middle" class="xs">unknown 不推断为成功</text>
<path d="M1385 280 V320 H315 V365 M520 450 H595 M1005 450 H1080" stroke="#64748b" stroke-width="2" fill="none"/><path d="M308 352 l7 13 7 -13 M582 443 l13 7 -13 7 M1067 443 l13 7 -13 7" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="290" y="635" width="470" height="160" rx="14" class="amber"/><text x="525" y="672" text-anchor="middle" class="s" font-weight="700">模拟 vs 实际链路差异</text><text x="525" y="707" text-anchor="middle" class="xs">被测插件造成的动态子 Agent 调用是结果</text><text x="525" y="732" text-anchor="middle" class="xs">未声明的模型/Provider 漂移是协议偏离</text><text x="525" y="757" text-anchor="middle" class="xs">计划图不覆盖实际事实</text>
<rect x="850" y="635" width="470" height="160" rx="14" class="blue"/><text x="1085" y="672" text-anchor="middle" class="s" font-weight="700">快 · 好 · 省对比</text><text x="1085" y="707" text-anchor="middle" class="xs">同题/同模型/同任务分层配对</text><text x="1085" y="732" text-anchor="middle" class="xs">时间、质量、Token/费用</text><text x="1085" y="757" text-anchor="middle" class="xs">样本覆盖、缺失、可比性 Gate</text>
<path d="M1285 535 V590 H525 V635 M760 715 H850" stroke="#64748b" stroke-width="2" fill="none"/><path d="M518 622 l7 13 7 -13 M837 708 l13 7 -13 7" stroke="#64748b" stroke-width="2" fill="none"/>
<text x="60" y="885" class="xs muted">无独立控制点的功能只做默认行为/场景观察或命名 Profile 对照，不归因到单一 package。</text><text x="60" y="910" class="xs muted">配置入口决定可干预范围；目录节点数量不等于外部开关数量。</text></svg>