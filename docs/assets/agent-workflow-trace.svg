<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><title>Agent 实际调用链</title><style>text{font-family:'Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif;fill:#1f2937} .t{font-size:25px;font-weight:700} .s{font-size:17px} .xs{font-size:14px} .node{fill:#f7fafc;stroke:#718096;stroke-width:1.6} .blue{fill:#e9f2ff;stroke:#5a85bf;stroke-width:1.6} .green{fill:#e8f5e9;stroke:#66a171;stroke-width:1.6} .amber{fill:#fff6df;stroke:#c59a43;stroke-width:1.6} .red{fill:#fff0f0;stroke:#c77777;stroke-width:1.6} .muted{fill:#526176}</style><rect width="1500" height="820" fill="#fff"/><text x="50" y="54" class="t">Agent 工作链路与日志下钻（概念示意）</text><text x="50" y="84" class="s muted">每个运行节点来自实际调用/事件；无观测时显示 unknown/stale</text>
<rect x="535" y="120" width="430" height="95" rx="14" class="blue"/><text x="750" y="155" text-anchor="middle" class="s" font-weight="700">Orchestrator / Parent Invocation</text><text x="750" y="184" text-anchor="middle" class="xs">状态 · 时间 · Model/Provider · Event ID</text>
<rect x="80" y="300" width="360" height="110" rx="14" class="green"/><text x="260" y="338" text-anchor="middle" class="s" font-weight="700">Manager / Planning</text><text x="260" y="367" text-anchor="middle" class="xs">completed · observed</text><text x="260" y="389" text-anchor="middle" class="xs">日志 / Token / 工具调用</text>
<rect x="570" y="300" width="360" height="110" rx="14" class="amber"/><text x="750" y="338" text-anchor="middle" class="s" font-weight="700">Engineer / Child Agent</text><text x="750" y="367" text-anchor="middle" class="xs">running · observed</text><text x="750" y="389" text-anchor="middle" class="xs">子调用 / Workspace diff / Artifact</text>
<rect x="1060" y="300" width="360" height="110" rx="14" class="red"/><text x="1240" y="338" text-anchor="middle" class="s" font-weight="700">DevOps / Tool or Process</text><text x="1240" y="367" text-anchor="middle" class="xs">unknown / waiting / failed</text><text x="1240" y="389" text-anchor="middle" class="xs">错误码 / 取消 / 清理状态</text>
<path d="M750 215 V250 H260 V300 M750 250 V300 M750 250 H1240 V300" stroke="#64748b" stroke-width="2" fill="none"/><path d="M253 287 l7 13 7 -13 M743 287 l7 13 7 -13 M1233 287 l7 13 7 -13" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="80" y="500" width="1340" height="120" rx="14" class="node"/><text x="750" y="536" text-anchor="middle" class="s" font-weight="700">统一事件时间线与关联索引</text><text x="750" y="568" text-anchor="middle" class="xs">Experiment → Run → CaseExecution → AgentInvocation → Tool/Provider Request → Artifact</text><text x="750" y="594" text-anchor="middle" class="xs">按 invocation_id / parent_id / correlation_id / request_id 下钻；secret 在入库前脱敏</text>
<path d="M260 410 V455 H350 V500 M750 410 V500 M1240 410 V455 H1150 V500" stroke="#64748b" stroke-width="2" fill="none"/><path d="M343 487 l7 13 7 -13 M743 487 l7 13 7 -13 M1143 487 l7 13 7 -13" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="250" y="680" width="1000" height="80" rx="14" class="blue"/><text x="750" y="713" text-anchor="middle" class="s" font-weight="700">点选节点：查看状态历史、日志、模型路由、用量、输入/输出摘要与证据</text><text x="750" y="740" text-anchor="middle" class="xs">计划模拟图与实际观测图分开展示，不能相互替代</text><path d="M750 620 V680" stroke="#64748b" stroke-width="2" fill="none"/></svg>